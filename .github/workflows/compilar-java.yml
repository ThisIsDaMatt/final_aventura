name: Compilar juego Java

on:
  push:
    branches:
      - integracion-habitaciones-2-y-3
  pull_request:
    branches:
      - main

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: escape_la_habitacion
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar
        run: javac *.java
